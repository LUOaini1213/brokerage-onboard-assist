                                    - CustomerName_DataCard1:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicTextualEdit
                                        IsLocked: true
                                        Properties:
                                          BorderColor: =RGBA(245, 245, 245, 1)
                                          DataField: ="Title"
                                          Default: =ThisItem.CustomerName
                                          DisplayName: =DataSourceInfo([@BA_Customers],DataSourceInfo.DisplayName,'Title')
                                          MaxLength: =DataSourceInfo([@BA_Customers], DataSourceInfo.MaxLength, 'Title')
                                          Required: =true
                                          Update: =DataCardValue1.Text
                                          Width: =458
                                          X: =0
                                          Y: =0
