                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Height: =36
                                    OnSelect: =Navigate(ShipmentsScreen, ScreenTransition.Cover)
                                    Text: ="First 3 shipments"
                                    Visible: =!IsBlank(RecordsGallery1.Selected.AccountNo) && (RecordsGallery1.Selected.EnrolmentStatus.Value = "Validated" || RecordsGallery1.Selected.EnrolmentStatus.Value = "Active")
